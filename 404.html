<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Nocturne</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050714">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23050714'/%3E%3Cpath d='M32 9l4.3 18.7L55 32l-18.7 4.3L32 55l-4.3-18.7L9 32l18.7-4.3L32 9Z' fill='%23d9ff6d'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fff'/%3E%3C/svg%3E">

  <!--
    Styles are inlined on purpose. GitHub Pages serves this file for ANY missing
    path under the site, including deep ones like /nocturne/a/b/c, where a
    relative <link href="styles.css"> would resolve against that path and 404
    too — leaving an unstyled page exactly when something has already gone
    wrong. Inlining is correct at every depth and costs almost nothing.

    Tokens are copied by hand from styles.css. If the palette there changes,
    this follows.
  -->
  <style>
    :root {
      --bg: #050714; --bg-deep: #02030a; --ink: #f4f2ea; --muted: #979bad;
      --accent: #d9ff6d;
      --display: Didot, "Bodoni MT", Georgia, serif;
      --sans: Inter, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: radial-gradient(circle at 50% 45%, var(--bg), var(--bg-deep) 72%);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 32rem; text-align: center; }
    .kicker {
      margin: 0 0 1.4rem;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 1.2rem;
      font-family: var(--display);
      font-size: clamp(2.6rem, 9vw, 4.4rem);
      font-weight: 400;
      line-height: 1.04;
    }
    h1 em { font-style: italic; color: var(--accent); }
    p { margin: 0 0 1.2rem; color: var(--muted); }
    .home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.4rem;
      padding: 0.85rem 1.5rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .home:hover { background: rgba(217, 255, 109, 0.12); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<main>
  <p class="kicker">Error 404</p>
  <h1>This star <em>went out.</em></h1>
  <p>
    There is no page at this address. The link that brought you here is
    mistyped, or it pointed at something that has since drifted away.
  </p>
  <a class="home" href="/nocturne/">Return to the field</a>
</main>

</body>
</html>
